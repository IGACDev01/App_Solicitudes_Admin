[theme]
# Color settings
base="light"
primaryColor="#006AB3"
secondaryBackgroundColor="#f0f2f6"

[server]
fileWatcherType = "none"
enableXsrfProtection = false
enableCORS = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"

# Critical for fixing module loading issues
[runner]
fastReruns = false


 